# Checks every push and pull request: Python compiles, translations complete, Python tests, interface builds without
# warnings, links in the handbook, the Navidrome plugin builds. The browser tests (npm run test:e2e) and the plugin
# check against Navidrome (tools/plugin-check.sh) need more and stay local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    # "shell: bash" runs every step with -o pipefail (GitHub's default is bash -e without it): a failing command in
    # "npm run build | tee build.log" then fails the step instead of being hidden by tee
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg and the optional Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install "pillow==11.3.0" "mutagen==1.47.0" "cryptography==44.0.3"
      - run: npm ci --no-audit --no-fund
      - name: Python compiles
        run: python3 -m py_compile app/*.py tuttiphon.py
      - name: Translations
        run: npm run test:i18n
      - name: Interface builds without warnings
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -qi "warn" build.log; then echo "::error::The interface builds with warnings"; exit 1; fi
      - name: Python tests
        run: npm run test:py
      - name: Links in the handbook
        run: python3 tools/check-links.py
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: navidrome-plugin/go.sum
      - name: TinyGo (checked against its checksum)
        run: |
          curl -sSfL -o /tmp/tinygo.tar.gz https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo0.43.0.linux-amd64.tar.gz
          echo "ca9fc6d055e3889462dea4450a2e42a92242d88b5c362a7ec39bdb563413d78a  /tmp/tinygo.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/tinygo.tar.gz -C /opt
          echo "/opt/tinygo/bin" >> "$GITHUB_PATH"
      - name: Navidrome plugin builds
        run: |
          (cd navidrome-plugin && go vet .)
          tools/build-plugin.sh
